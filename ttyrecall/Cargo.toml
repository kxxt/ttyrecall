[package]
name = "ttyrecall"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = ["ebpf-libbpf"]
ebpf-aya = ["dep:aya", "dep:aya-log"]
ebpf-libbpf = ["dep:libbpf-rs"]

[dependencies]
aya = { version = "0.12", features = ["async_tokio"], optional = true }
aya-log = { version = "0.2", optional = true }
libbpf-rs = { version = "0.26.2", optional = true }
ttyrecall-common = { path = "../ttyrecall-common", features = ["user"] }
env_logger = "0.10"
libc = "0.2"
log = "0.4"
tokio = { version = "1.43", features = ["macros", "time", "rt", "rt-multi-thread", "net", "signal", "fs"] }
bstr = { version = "1.10.0", features = ["serde"] }
nix = { version = "0.29.0", features = ["fs", "user"] }
chrono = "0.4.38"
color-eyre = "0.6.3"
either = "1.13.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
clap = { version = "4.5.18", features = ["derive"] }
toml = "0.8.19"
zstd = "0.13.2"
clap_complete = "4.5.32"
thiserror = "1.0.64"
axum = "0.7.9"
tokio-util = { version = "0.7.12", features = ["io"] }
base64 = "0.22.1"
rand = "0.8.5"
pam = "0.8.0"
tower-http = { version = "0.5.2", features = ["fs"] }
constant_time_eq = "0.3.0"
inotify = "0.11.0"
ratatui = "=0.30.1"
crossterm = "0.29.0"
vt100 = "0.15.2"
meilisearch-sdk = "0.33.0"

[[bin]]
name = "ttyrecall"
path = "src/main.rs"
