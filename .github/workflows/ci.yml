name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  clippy:
    name: Clippy (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: libbpf-rs
            xtask_backend: libbpf
            args: --workspace --all-targets
          - backend: aya-rs
            xtask_backend: aya
            args: --workspace --all-targets --no-default-features --features ttyrecall/ebpf-aya
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - &install_bpf_native_dependencies
        name: Install native/eBPF dependencies
        env:
          APT_PACKAGES: clang libclang-dev libelf-dev libpam0g-dev llvm pkg-config zlib1g-dev libbpf-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y ${APT_PACKAGES}
      - &prepare_bpftool
        name: Prepare bpftool
        run: |
          case "$(uname -m)" in
            x86_64) bpftool_arch="amd64" ;;
            aarch64|arm64) bpftool_arch="arm64" ;;
            *) echo "unsupported bpftool architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          curl_args=(--fail --show-error --silent --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 120)
          latest_url="$(curl "${curl_args[@]}" --head -o /dev/null -w '%{url_effective}' https://github.com/libbpf/bpftool/releases/latest)"
          bpftool_tag="${latest_url##*/}"
          bpftool_archive="bpftool-${bpftool_tag}-${bpftool_arch}.tar.gz"
          bpftool_url="https://github.com/libbpf/bpftool/releases/download/${bpftool_tag}/${bpftool_archive}"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          curl "${curl_args[@]}" -o "${tmpdir}/${bpftool_archive}" "${bpftool_url}"
          curl "${curl_args[@]}" -o "${tmpdir}/${bpftool_archive}.sha256sum" "${bpftool_url}.sha256sum"
          (cd "${tmpdir}" && sha256sum -c "${bpftool_archive}.sha256sum")
          tar -xzf "${tmpdir}/${bpftool_archive}" -C "${tmpdir}"
          sudo install -m 0755 "${tmpdir}/bpftool" /usr/local/bin/bpftool
          bpftool version
      - name: Install Aya eBPF linker
        if: matrix.xtask_backend == 'aya'
        run: cargo install bpf-linker --locked
      - name: Build eBPF object
        run: cargo xtask build-ebpf --backend ${{ matrix.xtask_backend }}
      - name: Run clippy
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check
          arguments: --workspace

  build:
    name: Build (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: libbpf-rs
            xtask_backend: libbpf
          - backend: aya-rs
            xtask_backend: aya
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - *install_bpf_native_dependencies
      - *prepare_bpftool
      - name: Install Aya eBPF linker
        if: matrix.xtask_backend == 'aya'
        run: cargo install bpf-linker --locked
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build
        run: cargo xtask build --backend ${{ matrix.xtask_backend }} --skip-frontend-deps

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - *install_bpf_native_dependencies
      - *prepare_bpftool
      - name: Install Aya eBPF linker
        run: cargo install bpf-linker --locked
      - name: Build libbpf-rs eBPF object
        run: cargo xtask build-ebpf --backend libbpf
      - name: Collect libbpf-rs coverage
        run: cargo llvm-cov --workspace --all-targets --no-report
      - name: Build aya-rs eBPF object
        run: cargo xtask build-ebpf --backend aya
      - name: Collect aya-rs coverage
        run: cargo llvm-cov --workspace --all-targets --no-default-features --features ttyrecall/ebpf-aya --no-report
      - name: Generate merged coverage report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: true
          verbose: true
