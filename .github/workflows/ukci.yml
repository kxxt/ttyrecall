name: UKCI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &trigger_paths
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "ttyrecall/**"
      - "ttyrecall-common/**"
      - "ttyrecall-ebpf/src/libbpf/**"
      - ".github/workflows/ukci.yml"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths: *trigger_paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ukci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - &install-nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
            http2 = false

      - &attic-writable
        name: Setup Attic cache (Writable)
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        if: github.event.pull_request.head.repo.fork != true
        with:
          endpoint: https://nix.kxxt.dev
          cache: ttyrecall
          token: ${{ secrets.NIX_CACHE_JWT }}

      - &attic-rdonly
        name: Setup Attic cache (ReadOnly)
        uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
        if: github.event.pull_request.head.repo.fork == true
        with:
          endpoint: https://nix.kxxt.dev
          cache: ttyrecall
          skip-push: true
      - name: Run UKCI
        env:
          UKCI_SUMMARY_TITLE: UKCI (${{ matrix.os }})
        run: nix run ".#ukci"
      - name: Add gc root for UKCI
        run: ln -s "$(nix eval --raw '.#ukci')" /nix/var/nix/gcroots/ukci

  ukci-cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64]
    steps:
      - uses: actions/checkout@v4

      - *install-nix

      - *attic-writable

      - *attic-rdonly
      
      - name: Run UKCI
        env:
          UKCI_SUMMARY_TITLE: UKCI (cross ${{ matrix.arch }})
        run: nix run ".#ukci-${{ matrix.arch }}"
      - name: Add gc root for UKCI
        run: ln -s "$(nix eval --raw '.#ukci-${{ matrix.arch }}')" /nix/var/nix/gcroots/ukci-${{ matrix.arch }}
